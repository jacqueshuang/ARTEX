name: release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # 创建 Release 需要
  packages: write   # 推 ghcr.io 镜像需要

env:
  REGISTRY: ghcr.io
  # 基础镜像来源。已登录 Docker Hub 时按账号计额度，不再受 runner 共享 IP 的匿名限流影响。
  BASE_IMAGE_UPSTREAM: python:3.12-slim-bookworm

jobs:
  # ① 前端静态导出（一次），产物给交叉编译各平台复用
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/out

  # ② 五平台交叉编译（内嵌前端）+ 打 zip
  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build and package with build.sh
        env:
          ARTEX_TARGET_OS: ${{ matrix.goos }}
          ARTEX_TARGET_ARCH: ${{ matrix.goarch }}
          ARTEX_BUILD_VERSION: ${{ github.ref_name }}
          ARTEX_SKIP_FRONTEND: "1"
          ARTEX_SKIP_NPM_CI: "1"
          # UPX 自解压 ELF 在部分 Linux 内核、虚拟化和安全策略下会崩溃。
          # Release 使用 Go linker 裁剪和 zip 压缩，优先保证可移植性。
          ARTEX_COMPRESS: "0"
          ARTEX_PACKAGE: "1"
          ARTEX_PACKAGE_DIR: dist
        run: |
          ./build.sh --target "${ARTEX_TARGET_OS}/${ARTEX_TARGET_ARCH}"
      - name: Smoke test Linux amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: dist/artex-linux-amd64/artex -h
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "dist/*.zip"
      # Linux 生二进制单独上传，供 docker job 复用（免在镜像里重编前端+Go）
      - if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-${{ matrix.goarch }}
          path: dist/artex-linux-${{ matrix.goarch }}/artex

  # ③ 把基础镜像搬到自己的 GHCR：构建阶段从此只跟 ghcr.io 打交道。
  #    Docker Hub 凭证存在时按账号拉取；带 5 次指数退避，扛住突发限流。
  mirror-base:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    outputs:
      image: ${{ steps.ns.outputs.base }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Resolve lowercase namespace
        id: ns
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "base=${REGISTRY}/$owner/base/python:3.12-slim-bookworm" >> "$GITHUB_OUTPUT"
      # 没有配置 Docker Hub secret 时自动跳过，退化为匿名拉取 + 重试
      - name: Log in to Docker Hub
        if: env.DH_USER != ''
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Mirror python base image into GHCR
        env:
          BASE_IMAGE_TARGET: ${{ steps.ns.outputs.base }}
        run: |
          set -uo pipefail
          for i in 1 2 3 4 5; do
            if docker buildx imagetools create \
                 --tag "$BASE_IMAGE_TARGET" \
                 "$BASE_IMAGE_UPSTREAM"; then
              echo "mirrored: $BASE_IMAGE_UPSTREAM -> $BASE_IMAGE_TARGET"
              exit 0
            fi
            echo "::warning::mirror attempt $i failed, backing off $((i * 20))s"
            sleep $((i * 20))
          done
          echo "::error::mirror failed after 5 attempts"
          exit 1
      - name: Show copied image
        run: docker buildx imagetools inspect "${{ steps.ns.outputs.base }}"

  # ④ 多架构镜像 → 推 GHCR（复用 binaries 编好的 Linux 二进制，
  #    镜像里只装工具 + 放二进制；arm64 仅需模拟 apt 层，构建快很多）
  docker:
    needs: [binaries, mirror-base]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4            # 取 Dockerfile 与 skills/
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-amd64
          path: dist/amd64
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-arm64
          path: dist/arm64

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # GHCR 镜像名必须全小写，owner 可能大写（Autumn27 → autumn27）
      - name: Resolve lowercase namespace
        id: ns
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/artex
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 基础镜像来自 GHCR 的镜像副本，构建全程不碰 Docker Hub
          build-args: |
            BASE_IMAGE=${{ needs.mirror-base.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          {
            echo "### artex image"
            echo ""
            echo "Registry: \`${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/artex\`"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
