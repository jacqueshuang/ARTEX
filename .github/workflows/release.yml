name: release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # 创建 Release 需要
  packages: write   # 推 ghcr.io 镜像需要

env:
  REGISTRY: ghcr.io
  BASE_IMAGE_TAG: "3.12-slim-bookworm"

jobs:
  # ① 前端静态导出（一次），产物给交叉编译各平台复用
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/out

  # ② 五平台交叉编译（内嵌前端）+ 打 zip
  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build and package with build.sh
        env:
          ARTEX_TARGET_OS: ${{ matrix.goos }}
          ARTEX_TARGET_ARCH: ${{ matrix.goarch }}
          ARTEX_BUILD_VERSION: ${{ github.ref_name }}
          ARTEX_SKIP_FRONTEND: "1"
          ARTEX_SKIP_NPM_CI: "1"
          # UPX 自解压 ELF 在部分 Linux 内核、虚拟化和安全策略下会崩溃。
          # Release 使用 Go linker 裁剪和 zip 压缩，优先保证可移植性。
          ARTEX_COMPRESS: "0"
          ARTEX_PACKAGE: "1"
          ARTEX_PACKAGE_DIR: dist
        run: |
          ./build.sh --target "${ARTEX_TARGET_OS}/${ARTEX_TARGET_ARCH}"
      - name: Smoke test Linux amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: dist/artex-linux-amd64/artex -h
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "dist/*.zip"
      # Linux 生二进制单独上传，供 docker job 复用（免在镜像里重编前端+Go）
      - if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-${{ matrix.goarch }}
          path: dist/artex-linux-${{ matrix.goarch }}/artex

  # ③ 多架构镜像 → 推 GHCR
  #    不启动 buildx 的 docker-container builder，也不拉 tonistiigi/binfmt：
  #    这两个镜像只有 Docker Hub 一个源，在 runner 共享 IP 下必撞匿名限流。
  #    基础镜像用多源回退拉取后打成本地短名，构建阶段不再联网取 FROM。
  docker:
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILDKIT: "1"
      DOCKER_CLI_EXPERIMENTAL: "enabled"   # docker manifest 子命令
    steps:
      - uses: actions/checkout@v4              # 取 Dockerfile 与 skills/
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-amd64
          path: dist/amd64
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-arm64
          path: dist/arm64

      # GHCR 镜像名必须全小写，owner 可能大写（Autumn27 → autumn27）
      - name: Resolve lowercase namespace
        id: ns
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/$owner/artex" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 第一顺位是 GHCR 副本（若你跑过 mirror-images），未命中会自动跳过；
      # 后两个是免认证公共源，两者限流池互相独立，交替重试命中率远高于单源。
      - name: Fetch base images (multi-source with backoff)
        env:
          GHCR_BASE: ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/base/python:${{ env.BASE_IMAGE_TAG }}
        run: |
          set -uo pipefail
          tag="$BASE_IMAGE_TAG"
          sources=(
            "$GHCR_BASE"
            "public.ecr.aws/docker/library/python:${tag}"
            "docker.io/library/python:${tag}"
          )
          for pair in "amd64 linux/amd64" "arm64 linux/arm64"; do
            set -- $pair
            arch="$1"; platform="$2"
            local_ref="artex-base-python:${arch}-${tag}"
            ok=0
            for attempt in 1 2 3 4 5 6; do
              for src in "${sources[@]}"; do
                if docker pull --platform "$platform" "$src" >/dev/null 2>&1; then
                  docker tag "$src" "$local_ref"
                  echo "base[$arch] <- $src"
                  ok=1
                  break
                fi
                echo "::warning::pull miss ($platform): $src"
              done
              [ "$ok" = 1 ] && break
              echo "::warning::round $attempt exhausted for $platform, sleeping $((attempt * 20))s"
              sleep $((attempt * 20))
            done
            [ "$ok" = 1 ] || { echo "::error::no source served base image for $platform"; exit 1; }
          done
          docker images 'artex-base-python:*'

      # arm64 的 RUN apt-get 需要 binfmt。用发行版自带 qemu-user-static 注册，
      # 走 archive.ubuntu.com，与容器镜像仓库限流无关。runner 上多数已预注册。
      - name: Ensure arm64 binfmt
        run: |
          set -euo pipefail
          if [ -f /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
            echo "qemu-aarch64 already registered"
          else
            sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc 2>/dev/null || true
            sudo apt-get update -qq
            sudo apt-get install -y -qq qemu-user-static binfmt-support
            sudo update-binfmts --enable qemu-aarch64 || true
          fi
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/artex
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build per-arch images
        env:
          IMAGE: ${{ steps.ns.outputs.image }}
        run: |
          set -euo pipefail
          tag="$BASE_IMAGE_TAG"
          for pair in "amd64 linux/amd64" "arm64 linux/arm64"; do
            set -- $pair
            arch="$1"; platform="$2"
            echo "::group::build $arch ($platform)"
            docker build \
              --platform "$platform" \
              --build-arg BASE_IMAGE="artex-base-python:${arch}-${tag}" \
              -t "$IMAGE:staging-$arch" \
              .
            docker push "$IMAGE:staging-$arch"
            echo "::endgroup::"
          done

      - name: Assemble and push multi-arch manifests
        env:
          IMAGE: ${{ steps.ns.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker manifest create "$tag" \
              --amend "$IMAGE:staging-amd64" \
              --amend "$IMAGE:staging-arm64"
            docker manifest push "$tag"
            echo "pushed $tag"
          done <<< "$TAGS"

      - name: Image summary
        env:
          IMAGE: ${{ steps.ns.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### artex image"
            echo ""
            echo "Registry: \`$IMAGE\`"
            echo ""
            echo '```'
            echo "$TAGS"
            echo '```'
            echo ""
            echo '```'
            while IFS= read -r tag; do
              [ -z "$tag" ] && continue
              docker manifest inspect "$tag" | sed -n 's/.*"digest": "\([^"]*\)".*/digest: \1/p'
            done <<< "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
